
spring.application.name=backend

# =========================
# Server Configuration
# =========================
server.port=8080

# =========================
# MySQL Configuration
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sustainopt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.sustainopt.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# =========================
# JWT Configuration
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================
# AMSDOA Algorithm Weights
# =========================
amsdoa.weight.utility=0.60
amsdoa.weight.context=0.25
amsdoa.weight.interaction=0.10
amsdoa.weight.feedback=0.05
